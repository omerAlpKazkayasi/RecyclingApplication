version: '3.8'

services:
  postgres:
    image: postgres:18
    container_name: recyclingapp-postgres
    environment:
      POSTGRES_USER: recyclingapp
      POSTGRES_PASSWORD: recyclingapp_dev_2026
      POSTGRES_DB: recyclingapp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
